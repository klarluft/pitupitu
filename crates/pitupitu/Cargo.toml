[package]
name = "pitupitu"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The pitupitu box agent: links this machine's coding agents, running in herdr, to pitupitu cloud."

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
clap.workspace = true
dirs.workspace = true
futures-util.workspace = true
herdr = { path = "../herdr", package = "pitupitu-herdr" }
# Only the encoder: no image, SVG or PIC output, no dependencies of its own.
qrcode = { version = "0.14", default-features = false }
rand.workspace = true
regex = "1"
reqwest.workspace = true
serde.workspace = true
# preserve_order: a tool's "first argument" is the first one it was given.
serde_json = { workspace = true, features = ["preserve_order"] }
sha2 = "0.10"
tokio.workspace = true
tokio-tungstenite.workspace = true
toml_edit.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
axum = { version = "0.8", features = ["ws"] }
tempfile = "3"
