name: Release

# Push a tag like v0.1.0 to build the binaries and publish a GitHub release.
on:
  push:
    tags: ["v*"]
  # Builds and packages (signed, on macOS) without releasing anything, to
  # check the packaging before a tag.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }} -p pitupitu
      - name: Package
        env:
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_P12_PASSWORD: ${{ secrets.MACOS_SIGN_P12_PASSWORD }}
          REQUIRE_SIGNING: ${{ startsWith(github.ref, 'refs/tags/') && '1' || '' }}
        run: |
          name=pitupitu-${{ matrix.target }}
          mkdir "$name"
          cp LICENSE README.md "$name/"
          if [[ "${{ matrix.target }}" == *apple-darwin ]]; then
            # `pitupitu` and `pitupitu.app`, signed: macOS keeps privacy
            # answers across updates only for signed builds.
            version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
            packaging/macos/package.sh target/${{ matrix.target }}/release/pitupitu "$name" "$version"
          else
            cp target/${{ matrix.target }}/release/pitupitu "$name/"
          fi
          tar czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: pitupitu-${{ matrix.target }}
          path: pitupitu-${{ matrix.target }}.tar.gz*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: src
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      # The Homebrew formula, filled from the checksums just built;
      # klarluft/homebrew-tap copies it from the release.
      - run: src/packaging/homebrew/fill.sh "${GITHUB_REF_NAME#v}" . > pitupitu.rb
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes pitupitu-*.tar.gz* pitupitu.rb
