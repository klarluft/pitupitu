name: Release

# Push a tag like v0.1.0 to build the binaries and publish a GitHub release.
on:
  push:
    tags: ["v*"]
  # Builds and packages (signed, on macOS) without releasing anything, to
  # check the packaging before a tag.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }} -p pitupitu
      - name: Package
        env:
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_P12_PASSWORD: ${{ secrets.MACOS_SIGN_P12_PASSWORD }}
          REQUIRE_SIGNING: ${{ startsWith(github.ref, 'refs/tags/') && '1' || '' }}
        run: |
          name=pitupitu-${{ matrix.target }}
          mkdir "$name"
          cp LICENSE README.md "$name/"
          if [[ "${{ matrix.target }}" == *apple-darwin ]]; then
            # `pitupitu` and `pitupitu.app`, signed: macOS keeps privacy
            # answers across updates only for signed builds.
            version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
            packaging/macos/package.sh target/${{ matrix.target }}/release/pitupitu "$name" "$version"
          else
            cp target/${{ matrix.target }}/release/pitupitu "$name/"
          fi
          tar czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: pitupitu-${{ matrix.target }}
          path: pitupitu-${{ matrix.target }}.tar.gz*

  # A Homebrew bottle per platform, from the tarballs just built and before
  # anything is published (packaging/homebrew/bottle.sh): the tap copies the
  # formula as soon as the release is out, so it must carry its bottles.
  # Each runner's macOS is the oldest one its bottle is for; newer ones pour
  # it too.
  bottle:
    needs: build
    strategy:
      matrix:
        os: [macos-15, macos-15-intel, ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: src
      - uses: Homebrew/actions/setup-homebrew@23156a3d9674d7f52f74f1a58979ec4d77847166
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(sed -n 's/^version = "\(.*\)"/\1/p' src/Cargo.toml | head -1)"
          fi
          src/packaging/homebrew/bottle.sh "$version" dist bottles
      - uses: actions/upload-artifact@v7
        with:
          name: bottle-${{ matrix.os }}
          path: bottles/pitupitu-*.bottle.*

  release:
    needs: [build, bottle]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: src
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      # The Homebrew formula, filled from the checksums and the bottles just
      # built; klarluft/homebrew-tap copies it from the release.
      - run: src/packaging/homebrew/fill.sh "${GITHUB_REF_NAME#v}" . > pitupitu.rb
      # `pitupitu-*.tar.gz*`: the tarballs with their checksums, and the
      # bottles (`pitupitu-<version>.<tag>.bottle.tar.gz`).
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes pitupitu-*.tar.gz* pitupitu.rb
